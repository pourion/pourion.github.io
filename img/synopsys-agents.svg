<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" role="img" aria-label="Schematic of a multi-agent system orchestrating EDA tasks on a chip design.">
  <rect width="800" height="600" fill="#0B0C0F"/>

  <!-- Subtle grid backdrop -->
  <g opacity="0.045" stroke="#F2EFE8" stroke-width="0.5">
    <path d="M 0 80 H 800 M 0 160 H 800 M 0 240 H 800 M 0 320 H 800 M 0 400 H 800 M 0 480 H 800"/>
    <path d="M 80 0 V 600 M 160 0 V 600 M 240 0 V 600 M 320 0 V 600 M 400 0 V 600 M 480 0 V 600 M 560 0 V 600 M 640 0 V 600 M 720 0 V 600"/>
  </g>

  <!-- Eyebrow label -->
  <text x="40" y="48" font-family="ui-monospace, JetBrains Mono, Menlo, monospace" font-size="11" fill="#B388EB" letter-spacing="0.22em">MULTI-AGENT · EDA</text>
  <text x="760" y="48" text-anchor="end" font-family="ui-monospace, JetBrains Mono, Menlo, monospace" font-size="10" fill="#5C5852" letter-spacing="0.18em">SCHEMATIC · 2024</text>
  <line x1="40" y1="60" x2="760" y2="60" stroke="#F2EFE8" stroke-width="0.5" opacity="0.18"/>

  <!-- Orchestrator -->
  <g>
    <circle cx="400" cy="115" r="6" fill="#B388EB"/>
    <circle cx="400" cy="115" r="18" stroke="#B388EB" stroke-width="1" fill="none" opacity="0.35"/>
    <circle cx="400" cy="115" r="32" stroke="#B388EB" stroke-width="0.5" fill="none" opacity="0.18"/>
    <text x="400" y="92" text-anchor="middle" font-family="ui-monospace, JetBrains Mono, Menlo, monospace" font-size="10" fill="#F2EFE8" letter-spacing="0.18em">ORCHESTRATOR</text>
  </g>

  <!-- Dashed routing from orchestrator down to four agents -->
  <g stroke="#F2EFE8" stroke-width="0.85" opacity="0.42" stroke-dasharray="2 4" fill="none">
    <path d="M 400 121 C 400 175, 180 175, 160 235"/>
    <path d="M 400 121 C 400 175, 320 175, 320 235"/>
    <path d="M 400 121 C 400 175, 480 175, 480 235"/>
    <path d="M 400 121 C 400 175, 620 175, 640 235"/>
  </g>

  <!-- Agent row -->
  <g font-family="ui-monospace, JetBrains Mono, Menlo, monospace" font-size="10" letter-spacing="0.18em" text-anchor="middle">
    <!-- Agent A: PARTITION -->
    <g>
      <rect x="100" y="232" width="120" height="48" fill="none" stroke="#F2EFE8" stroke-width="1" opacity="0.55"/>
      <text x="160" y="262" fill="#F2EFE8">PARTITION</text>
      <circle cx="160" cy="232" r="2" fill="#B388EB"/>
    </g>
    <!-- Agent B: PLACE -->
    <g>
      <rect x="260" y="232" width="120" height="48" fill="none" stroke="#F2EFE8" stroke-width="1" opacity="0.55"/>
      <text x="320" y="262" fill="#F2EFE8">PLACE</text>
      <circle cx="320" cy="232" r="2" fill="#B388EB"/>
    </g>
    <!-- Agent C: ROUTE -->
    <g>
      <rect x="420" y="232" width="120" height="48" fill="none" stroke="#F2EFE8" stroke-width="1" opacity="0.55"/>
      <text x="480" y="262" fill="#F2EFE8">ROUTE</text>
      <circle cx="480" cy="232" r="2" fill="#B388EB"/>
    </g>
    <!-- Agent D: VERIFY -->
    <g>
      <rect x="580" y="232" width="120" height="48" fill="none" stroke="#F2EFE8" stroke-width="1" opacity="0.55"/>
      <text x="640" y="262" fill="#F2EFE8">VERIFY</text>
      <circle cx="640" cy="232" r="2" fill="#B388EB"/>
    </g>
  </g>

  <!-- Lines from agents down to the die corners (each agent writes into the design) -->
  <g stroke="#F2EFE8" stroke-width="0.6" opacity="0.28" fill="none">
    <path d="M 160 280 C 160 340, 270 340, 270 360"/>
    <path d="M 320 280 C 320 320, 370 340, 370 360"/>
    <path d="M 480 280 C 480 320, 430 340, 430 360"/>
    <path d="M 640 280 C 640 340, 530 340, 530 360"/>
  </g>

  <!-- Chip die (the design being acted on) -->
  <g transform="translate(280, 360)">
    <text x="120" y="-12" text-anchor="middle" font-family="ui-monospace, JetBrains Mono, Menlo, monospace" font-size="10" fill="#B388EB" letter-spacing="0.22em" opacity="0.85">DESIGN</text>
    <rect x="0" y="0" width="240" height="180" fill="none" stroke="#B388EB" stroke-width="1.5"/>
    <!-- corner ticks -->
    <g stroke="#B388EB" stroke-width="1">
      <path d="M -4 0 H 6 M 0 -4 V 6"/>
      <path d="M 234 0 H 244 M 240 -4 V 6"/>
      <path d="M -4 180 H 6 M 0 174 V 184"/>
      <path d="M 234 180 H 244 M 240 174 V 184"/>
    </g>

    <!-- Internal cell grid -->
    <g stroke="#F2EFE8" stroke-width="0.5" opacity="0.18">
      <path d="M 30 0 V 180 M 60 0 V 180 M 90 0 V 180 M 120 0 V 180 M 150 0 V 180 M 180 0 V 180 M 210 0 V 180"/>
      <path d="M 0 30 H 240 M 0 60 H 240 M 0 90 H 240 M 0 120 H 240 M 0 150 H 240"/>
    </g>

    <!-- Placed cells -->
    <g fill="#F2EFE8" opacity="0.3">
      <rect x="30" y="30" width="30" height="30"/>
      <rect x="90" y="60" width="60" height="30"/>
      <rect x="180" y="30" width="30" height="60"/>
      <rect x="60" y="120" width="30" height="30"/>
      <rect x="150" y="120" width="60" height="30"/>
    </g>

    <!-- Hot cells (currently being optimized by an agent) -->
    <g fill="#B388EB" opacity="0.65">
      <rect x="120" y="90" width="30" height="30"/>
      <rect x="60" y="60" width="30" height="30"/>
    </g>
    <g stroke="#B388EB" stroke-width="0.75" fill="none" opacity="0.9">
      <rect x="120" y="90" width="30" height="30"/>
      <rect x="60" y="60" width="30" height="30"/>
    </g>

    <!-- Routed nets -->
    <g stroke="#B388EB" stroke-width="1" fill="none" opacity="0.6">
      <path d="M 45 60 L 75 60 L 75 90 L 105 90"/>
      <path d="M 135 105 L 195 105 L 195 75"/>
      <path d="M 75 135 L 165 135"/>
      <path d="M 165 75 L 165 45 L 195 45"/>
    </g>
  </g>

  <!-- Iteration loop on the right -->
  <g stroke="#B388EB" stroke-width="1" fill="none" opacity="0.55">
    <path d="M 540 545 C 720 545, 720 360, 715 260" stroke-dasharray="3 5"/>
    <path d="M 715 260 L 708 271 M 715 260 L 722 269" stroke-linecap="round"/>
  </g>
  <text x="730" y="430" font-family="ui-monospace, JetBrains Mono, Menlo, monospace" font-size="10" fill="#B388EB" letter-spacing="0.2em" opacity="0.8">ITERATE</text>

  <!-- Bottom-left status footer -->
  <line x1="40" y1="558" x2="760" y2="558" stroke="#F2EFE8" stroke-width="0.5" opacity="0.18"/>
  <text x="40" y="582" font-family="ui-monospace, JetBrains Mono, Menlo, monospace" font-size="9" fill="#5C5852" letter-spacing="0.16em">PLACE · ROUTE · VERIFY · ↺</text>
  <text x="760" y="582" text-anchor="end" font-family="ui-monospace, JetBrains Mono, Menlo, monospace" font-size="9" fill="#5C5852" letter-spacing="0.16em">FOUNDING ENG · GENAI SOLUTIONS</text>
</svg>
